<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小财通 · 首页</title>
<link rel="stylesheet" href="style.css">
<style>
  /* 本页私有样式：三市场状态条 + 行情刷新按钮（布局/视觉与已验收首页一致） */
  .mkt-sessions { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 10px; }
  .mkt-session-chip {
    font-size: 11px; padding: 3px 10px; border-radius: 20px; white-space: nowrap;
    background: var(--tag-blue-bg); color: var(--tag-blue-ink);
  }
  .mkt-session-chip.live { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .mkt-session-chip.warn { background: var(--tag-orange-bg); color: var(--tag-orange-ink); }
  #mktRefreshBtn { flex-shrink: 0; }
  #mktRefreshBtn.busy { opacity: .5; pointer-events: none; }
  .alert-empty { padding: 6px 2px 2px; }
  .alert-empty b { font-size: 13.5px; font-weight: 600; display: block; }
  .alert-empty p { color: var(--ink-2); font-size: 12.5px; margin-top: 3px; line-height: 1.6; }
  .mkt-row.unavailable .mkt-val b { color: var(--ink-3); font-weight: 500; }
  .hero-foot { margin-top: 8px; font-size: 12px; color: var(--ink-3); }
  .hero-empty { margin-top: 10px; font-size: 13px; color: var(--ink-2); }
  .hero-empty a { color: var(--brand); text-decoration: none; }
</style>
<script>
  // 恢复上次选择的外观模式与主题颜色（正式版在「设置 → 外观」中提供）
  (function () {
    if (localStorage.getItem('xltc-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
    var a = localStorage.getItem('xltc-accent');
    if (a) document.documentElement.dataset.accent = a;
  })();
</script>
</head>
<body>

<!-- 顶部导航 -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo"><span class="logo-dot"></span><span class="logo-text">小财通</span></div>
    <nav class="nav" id="mainNav"></nav>
    <div class="topbar-right">
      <button id="appearanceBtn" class="btn btn-ghost btn-sm">☀️ 浅色 · 🎨 蓝色</button>
    </div>
  </div>
</header>

<main class="page">
  <div class="page-title" id="greeting">你好 👋</div>
  <div class="page-sub">你的钱和今天的市场，都在这里了。</div>

  <!-- 第一行：资产总览 + 市场速览 + 今日提醒（真实数据，2026-09-05 改造） -->
  <div class="grid grid-3" style="margin-bottom:16px;">
    <!-- 资产总览（真实持仓，来自本机数据库） -->
    <div class="asset-hero">
      <div class="label">我的总资产</div>
      <div class="amount num" id="heroTotal">—</div>
      <div class="small" style="opacity:.85;">今日盈亏 <span class="num" id="heroToday">—</span></div>
      <div class="row">
        <div class="item">累计收益<b class="num" id="heroProfit">—</b></div>
        <div class="item">持仓收益率<b class="num" id="heroRate">—</b></div>
        <div class="item">持有基金<b class="num" id="heroCount">—</b></div>
      </div>
      <div class="hero-foot" id="heroFoot"></div>
    </div>

    <!-- 市场速览（8 只真实指数 · 时段感知自动排序 · 状态真实判断） -->
    <div class="card">
      <div class="card-title">市场速览
        <span class="hint" id="sessionHero">—</span>
        <button id="mktRefreshBtn" class="btn btn-ghost btn-sm" title="刷新行情">🔄</button>
      </div>
      <div class="mkt-sessions" id="mktSessions"></div>
      <div id="mktList"></div>
      <div class="fund-note" id="mktFoot" hidden>
        <span class="dot done"></span><b id="mktFootB"></b><p id="mktFootP"></p>
      </div>
    </div>

    <!-- 今日提醒（真实：触发了才显示；没有就保持安静） -->
    <div class="card">
      <div class="card-title">今日提醒 <a class="card-more" href="alerts.html">管理 →</a></div>
      <div id="alertList"></div>
    </div>
  </div>
</main>

<script src="nav.js"></script>
<script src="theme.js"></script>
<script src="notify.js"></script>
<script src="market.js"></script>

</body>
</html>
