<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小财通 · 市场机遇</title>
<link rel="stylesheet" href="style.css">
<script>
  (function () {
    if (localStorage.getItem('xltc-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
    var a = localStorage.getItem('xltc-accent');
    if (a) document.documentElement.dataset.accent = a;
  })();
</script>
<style>
  .op-hero { background: var(--brand-soft); border: 1px solid var(--ghost-border);
    border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; }
  .op-hero b { color: var(--brand); font-size: 15px; }
  .op-hero p { color: var(--ink-2); font-size: 13px; margin-top: 6px; line-height: 1.8; }
  .op-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .op-toolbar .op-updated { font-size: 12.5px; color: var(--ink-3); }
  .op-cats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .op-cat { border: 1px solid var(--card-border); background: var(--card); color: var(--ink-2);
    padding: 8px 18px; border-radius: 20px; font-size: 13.5px; cursor: pointer; }
  .op-cat.active { border-color: var(--brand); background: var(--brand); color: #fff; font-weight: 600; }
  .op-meta { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .op-meta span { font-size: 12.5px; color: var(--ink-3); }
  .op-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .op-card { text-align: left; background: var(--card); border: 1px solid var(--card-border);
    border-radius: 12px; padding: 16px 18px; cursor: pointer; min-width: 0; }
  .op-card:hover { border-color: var(--brand); box-shadow: var(--shadow); }
  .op-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .op-card-title b { font-size: 15.5px; }
  .op-card-title small { display: block; color: var(--ink-3); font-size: 12px; margin-top: 3px; }
  .op-quote { text-align: right; white-space: nowrap; }
  .op-quote .num { font-size: 18px; font-weight: 700; }
  .op-quote .num.up { color: var(--up); } .op-quote .num.down { color: var(--down); }
  .op-quote .num.flat { color: var(--flat); }
  .op-quote small { display: block; color: var(--ink-3); font-size: 11.5px; margin-top: 2px; }
  .op-brief { color: var(--ink-2); font-size: 13px; line-height: 1.75; margin: 12px 0; }
  .op-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 12px; color: var(--ink-3); }
  .op-foot .tag { font-size: 11px; }
  .op-empty { background: var(--bg-soft); border: 1px dashed var(--line); border-radius: 12px;
    padding: 28px; text-align: center; color: var(--ink-3); font-size: 13px; }
  .op-dcard { margin-bottom: 14px; }
  .op-dcard h3 { font-size: 15px; margin-bottom: 10px; }
  .op-dcard p { font-size: 13.5px; color: var(--ink-2); line-height: 1.9; }
  .op-watch { list-style: none; }
  .op-watch li { position: relative; padding-left: 16px; font-size: 13.5px; color: var(--ink-2);
    line-height: 2; }
  .op-watch li::before { content: '•'; position: absolute; left: 2px; color: var(--brand); }
  .op-fund { display: flex; align-items: center; justify-content: space-between; padding: 10px 0;
    border-bottom: 1px solid var(--line); }
  .op-fund b { font-size: 14px; }
  .op-fund small { display: block; color: var(--ink-3); font-size: 12px; margin-top: 2px; }
  .op-event { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .op-event b { font-size: 13.5px; font-weight: 600; }
  .op-event small { display: block; color: var(--ink-3); font-size: 12px; margin-top: 2px; }
  .op-risk { background: var(--note-bg); color: var(--note-ink); border-radius: 10px;
    padding: 14px 16px; font-size: 13px; line-height: 1.9; }
  .op-note { font-size: 12.5px; color: var(--ink-3); margin-top: 8px; line-height: 1.8; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo"><img class="logo-img" src="assets/brand/xltc-logo.png?v=r5.1" alt="小财通"><span class="logo-text">小财通</span></div>
    <nav class="nav" id="mainNav"></nav>
    <div class="topbar-right">
      <button id="appearanceBtn" class="btn btn-ghost btn-sm">☀️ 浅色 · 🎨 蓝色</button>
    </div>
  </div>
</header>

<main class="page">
  <!-- ===== 列表视图 ===== -->
  <div id="listView">
    <div class="page-title">市场机遇</div>
    <div class="page-sub">细分赛道 · 不读持仓。按产业环节整理的观察清单，先看逻辑、信号和风险。</div>

    <div class="op-hero">
      <b>不是荐基，也不是持仓推荐</b>
      <p>按产业环节整理的小赛道观察清单。先看逻辑、信号和风险，再决定要不要去基金页查对应产品。</p>
    </div>

    <div class="op-toolbar">
      <button class="btn btn-sm" id="refreshBtn">刷新赛道行情</button>
      <span class="op-updated" id="updatedText">正在读取…</span>
    </div>

    <div class="op-cats" id="catBar"></div>
    <div class="op-meta"><span id="countText">—</span><span id="quoteTimeText"></span></div>
    <div class="op-grid" id="themeGrid"></div>
    <div class="op-empty" id="listEmpty" style="display:none;">没有匹配的赛道。</div>
  </div>

  <!-- ===== 详情视图 ===== -->
  <div id="detailView" style="display:none;">
    <button class="btn btn-ghost btn-sm" id="backBtn">‹ 返回机遇</button>
    <div id="detailBody" style="margin-top:16px;"></div>
  </div>

  <div class="op-note">数据来自东方财富公开概念板块与全市场基金名单；行情为公开数据、非实时交易建议，本页不预测涨跌、不推荐具体基金。</div>
</main>

<script src="nav.js"></script>
<script src="theme.js"></script>
<script src="notify.js"></script>
<script>
(function () {
  'use strict';
  var overview = null;
  var category = 'all';

  function api() { return window.pywebview && window.pywebview.api; }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function fmtPct(p) {
    if (p === null || p === undefined || isNaN(Number(p))) return '—';
    var v = Number(p);
    return (v > 0 ? '+' : '') + v.toFixed(2) + '%';
  }
  function pctCls(p) {
    if (p === null || p === undefined || isNaN(Number(p))) return 'flat';
    return p > 0 ? 'up' : (p < 0 ? 'down' : 'flat');
  }
  function fmtPrice(p) {
    if (p === null || p === undefined || isNaN(Number(p))) return '—';
    return Number(p).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function timeText(at) {
    if (!at) return '行情读取中';
    var d = new Date(at);
    if (isNaN(d.getTime())) return '—';
    function p(n) { return ('0' + n).slice(-2); }
    return '板块行情 ' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
      p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function renderCats() {
    var bar = document.getElementById('catBar');
    bar.innerHTML = (overview.categories || []).map(function (c) {
      return '<button class="op-cat' + (c.id === category ? ' active' : '') +
        '" data-cat="' + esc(c.id) + '">' + esc(c.name) + '</button>';
    }).join('');
  }

  function renderGrid() {
    var themes = (overview.themes || []).filter(function (t) {
      return category === 'all' || t.category === category;
    });
    document.getElementById('countText').textContent = themes.length + ' 个细分赛道';
    document.getElementById('quoteTimeText').textContent = timeText(overview.at);
    var grid = document.getElementById('themeGrid');
    var empty = document.getElementById('listEmpty');
    if (!themes.length) { grid.innerHTML = ''; empty.style.display = ''; return; }
    empty.style.display = 'none';
    grid.innerHTML = themes.map(function (t) {
      var q = t.quote;
      var p = q ? q.pct : null;
      var price = q ? q.price : null;
      var countLine = q && q.up !== null && q.up !== undefined
        ? '上涨 ' + q.up + ' · 下跌 ' + (q.down === null || q.down === undefined ? '—' : q.down)
        : '';
      return '<button class="op-card" data-theme="' + esc(t.id) + '">' +
        '<div class="op-card-head"><div class="op-card-title"><b>' + esc(t.name) + '</b>' +
          '<small>' + esc(t.tag) + '</small></div>' +
          '<div class="op-quote"><span class="num ' + pctCls(p) + '">' + fmtPct(p) + '</span>' +
            '<small>' + (q ? '板块 ' + fmtPrice(price) : '行情待接入') + '</small></div></div>' +
        '<p class="op-brief">' + esc(t.brief) + '</p>' +
        '<div class="op-foot"><span class="tag">' + esc(t.tag) + '</span>' +
          '<span>' + countLine + ' 看逻辑 ›</span></div>' +
        '</button>';
    }).join('');
  }

  function renderDetail(d) {
    if (!d.ok) {
      document.getElementById('detailBody').innerHTML =
        '<div class="op-empty">' + esc(d.error || '没有找到该赛道') + '</div>';
      return;
    }
    var t = d.theme, q = d.quote;
    var p = q ? q.pct : null;
    var H = '';
    H += '<div class="card op-dcard"><div class="op-card-head">' +
      '<div class="op-card-title"><b style="font-size:18px;">' + esc(t.name) + '</b>' +
      '<small>' + esc(t.tag) + ' · ' + esc(t.boardCode) + '</small></div>' +
      '<div class="op-quote"><span class="num ' + pctCls(p) + '">' + fmtPct(p) + '</span>' +
      '<small>' + (q ? '板块 ' + fmtPrice(q.price) : '—') + '</small></div></div>' +
      '<p class="op-brief" style="margin-bottom:0;">' + esc(t.brief) + '</p></div>';

    H += '<div class="card op-dcard"><h3>赛道逻辑</h3><p>' + esc(t.thesis) + '</p></div>';

    H += '<div class="card op-dcard"><h3>观察信号</h3><ul class="op-watch">' +
      (t.watch || []).map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') +
      '</ul></div>';

    H += '<div class="card op-dcard"><h3>相关基金（非推荐）</h3>' +
      ((d.funds || []).length ? (d.funds).map(function (f) {
        return '<div class="op-fund"><div><b>' + esc(f.name) + '</b>' +
          '<small>' + esc(f.code) + ' · 指数型基金</small></div><span>查看 ›</span></div>';
      }).join('') : '<p class="op-note" style="margin:0;">暂未在真实基金名单中匹配到对应指数基金，可去基金页按关键词继续搜索。</p>') +
      '<p class="op-note">按基金名称匹配，只作研究线索；不代表纯赛道敞口，也不构成买入建议。</p></div>';

    H += '<div class="card op-dcard"><h3>近期公开事件</h3>' +
      ((d.events || []).length ? (d.events).map(function (e) {
        return '<div class="op-event"><b>' + esc(e.title_zh || e.title || '') + '</b>' +
          '<small>' + esc(e.published_at || '') + '</small></div>';
      }).join('') : '<p class="op-note" style="margin:0;">事件页暂未匹配到本赛道的公开消息。可以继续观察上面的产业信号，不要用单条消息替代研究。</p>') +
      '</div>';

    H += '<div class="op-risk"><b>风险提示：</b>' + esc(t.risk) +
      '<br>本页只做信息整理，不预测涨跌、不推荐具体基金。</div>';

    document.getElementById('detailBody').innerHTML = H;
  }

  function openDetail(id) {
    document.getElementById('detailBody').innerHTML = '<div class="op-empty">正在读取赛道详情…</div>';
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = '';
    window.scrollTo(0, 0);
    api().get_opportunity_detail(id).then(function (d) {
      renderDetail(d);
    }).catch(function (err) {
      document.getElementById('detailBody').innerHTML =
        '<div class="op-empty">读取失败：' + esc(err && err.message ? err.message : '本机数据服务不可用') + '</div>';
    });
  }

  function load() {
    var a = api();
    if (!a) return;
    document.getElementById('updatedText').textContent = '正在读取…';
    a.get_opportunity_overview().then(function (d) {
      overview = d;
      if (d.error) document.getElementById('updatedText').textContent = d.error;
      else document.getElementById('updatedText').textContent = '';
      renderCats();
      renderGrid();
    }).catch(function (err) {
      document.getElementById('updatedText').textContent =
        '读取失败：' + (err && err.message ? err.message : '本机数据服务不可用');
    });
  }

  document.getElementById('refreshBtn').addEventListener('click', load);
  document.getElementById('catBar').addEventListener('click', function (e) {
    var b = e.target.closest('.op-cat');
    if (!b) return;
    category = b.dataset.cat;
    renderCats();
    renderGrid();
  });
  document.getElementById('themeGrid').addEventListener('click', function (e) {
    var card = e.target.closest('.op-card');
    if (card) openDetail(card.dataset.theme);
  });
  document.getElementById('backBtn').addEventListener('click', function () {
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('listView').style.display = '';
    window.scrollTo(0, 0);
  });

  var tries = 0;
  var timer = setInterval(function () {
    if (api()) { clearInterval(timer); load(); }
    else if (++tries > 100) clearInterval(timer);
  }, 100);
}());
</script>
</body>
</html>
